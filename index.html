<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FDF1E2">
  <title>birthdayespesyal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="h-and-s.css">
</head>
<body>
  <!-- Keep the existing H and S scripts and styles from the original project. -->
  <div id="hns-background" class="hns-background" aria-hidden="true"></div>

  <main class="page-shell">
    <header class="page-heading">
      <span class="eyebrow">GIFT PARA SA BEBE KO</span>
      <h1>HAPPY BIRTHDAY SHEINA MAE!!</h1>
      <p>MAY YOU ENJOY YOUR DAY</p>
    </header>

    <!-- FRONT PAGE: THE WHOLE MINI CAROUSEL IS ONE LARGE BUTTON. -->
    <section class="front-view" id="frontView">
      <button class="mini-carousel" id="expandGallery" type="button" aria-label="Expand photo gallery">
        <span class="mini-card mini-outer mini-far-left"><img id="miniFarLeftImg" src="assets/demo-photo-5.svg" alt="Earlier memory"></span>
        <span class="mini-card mini-side mini-left"><img id="miniLeftImg" src="assets/demo-photo-8.svg" alt=""></span>
        <span class="mini-card mini-center">
          <img id="miniCenterImg" src="assets/demo-photo-1.svg" alt="Current memory">
        </span>
        <span class="mini-card mini-side mini-right"><img id="miniRightImg" src="assets/demo-photo-2.svg" alt=""></span>
        <span class="mini-card mini-outer mini-far-right"><img id="miniFarRightImg" src="assets/demo-photo-3.svg" alt="Later memory"></span>
      </button>

      <!-- Mochi is now the only feature on the front page: no toy controls. -->
      <div class="pet-stage">
        <div class="pet-room" id="petRoom" aria-label="Sitting orange pixel cat">
          <div class="floor-shadow" aria-hidden="true"></div>
          <canvas id="frontMochi" class="cat-canvas front-mochi" role="img"
                  aria-label="Animated orange pixel cat blinking and wagging its tail. Tap to show a heart."></canvas>
        </div>
      </div>
    </section>

    <!-- EXPANDED GALLERY: SAME UPLOADED ORANGE PIXEL CAT ON THE TOP BORDER. -->
    <section class="expanded-view hidden" id="expandedView" aria-label="Expanded memories gallery">
      <div class="gallery-frame">
        <div class="gallery-photo gallery-side gallery-left"><img id="leftImg" src="assets/demo-photo-8.svg" alt="Previous memory"></div>
        <div class="gallery-photo gallery-center">
          <img id="centerImg" src="assets/demo-photo-1.svg" alt="Selected memory">
          <button class="minimize-btn" id="minimizeGallery" type="button">Minimize gallery</button>
          <div class="gallery-cat mochi-location-top" id="galleryCat" aria-hidden="true">
            <canvas id="galleryMochi" class="cat-canvas gallery-cat-canvas"></canvas>
          </div>
        </div>
        <div class="gallery-photo gallery-side gallery-right"><img id="rightImg" src="assets/demo-photo-2.svg" alt="Next memory"></div>
      </div>

      <div class="message-row">
        <button class="arrow-btn" id="prevBtn" type="button" aria-label="Previous memory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5 5 12l7 7M19 5l-7 7 7 7"/></svg>
        </button>
        <button class="message-box" id="openLetter" type="button" aria-haspopup="dialog" aria-controls="memoryModal">
          <span class="card-kicker">A MESSAGE FOR YOU</span>
          <strong class="card-title" id="messageTitle">From: Name</strong>
          <span class="card-description" id="messagePreview">Click to open this letter.</span>
          <span class="card-hint">OPEN LETTER ↗</span>
        </button>
        <button class="arrow-btn" id="nextBtn" type="button" aria-label="Next memory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 7 7-7 7m7-14 7 7-7 7"/></svg>
        </button>
      </div>
    </section>
  </main>

  <!-- ORIGINAL OPEN-LETTER FEATURE: FULL PHOTO + COMPLETE MESSAGE -->
  <div class="modal" id="memoryModal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage" tabindex="-1">
      <svg class="flower flower-top-left" viewBox="0 0 130 130" aria-hidden="true"><g fill="none" stroke="#88749D" stroke-width="2.4" stroke-linecap="round"><path d="M12 116Q51 67 75 38M38 88Q15 76 21 51Q45 55 48 76M60 52Q55 30 79 17Q90 41 72 54"/></g><g fill="#D6BDD9" stroke="#9478A7" stroke-width="1.2"><ellipse cx="89" cy="25" rx="11" ry="18" transform="rotate(15 89 25)"/><ellipse cx="110" cy="44" rx="11" ry="18" transform="rotate(80 110 44)"/><ellipse cx="95" cy="60" rx="11" ry="18" transform="rotate(140 95 60)"/><ellipse cx="72" cy="45" rx="11" ry="18" transform="rotate(-60 72 45)"/></g><circle cx="91" cy="43" r="8" fill="#F4DDBA"/><path d="M29 71Q15 64 16 45Q39 49 40 65" fill="#91AA89"/></svg>
      <svg class="flower flower-bottom-right" viewBox="0 0 130 130" aria-hidden="true"><g fill="none" stroke="#88749D" stroke-width="2.4" stroke-linecap="round"><path d="M12 116Q51 67 75 38M38 88Q15 76 21 51Q45 55 48 76M60 52Q55 30 79 17Q90 41 72 54"/></g><g fill="#D6BDD9" stroke="#9478A7" stroke-width="1.2"><ellipse cx="89" cy="25" rx="11" ry="18" transform="rotate(15 89 25)"/><ellipse cx="110" cy="44" rx="11" ry="18" transform="rotate(80 110 44)"/><ellipse cx="95" cy="60" rx="11" ry="18" transform="rotate(140 95 60)"/><ellipse cx="72" cy="45" rx="11" ry="18" transform="rotate(-60 72 45)"/></g><circle cx="91" cy="43" r="8" fill="#F4DDBA"/><path d="M29 71Q15 64 16 45Q39 49 40 65" fill="#91AA89"/></svg>
      <div class="modal-grid">
        <div class="modal-photo-side">
          <div class="photo-frame"><img id="modalImage" src="" alt="Selected memory enlarged"></div>
          <div class="from-tag" id="modalFrom">From: Name</div>
        </div>
        <div class="modal-message-side">
          <div class="letter-content">
            <span class="letter-overline">JUST FOR YOU</span>
            <h2 id="modalTitle">From: Name</h2>
            <p id="modalMessage"></p>
          </div>
          <button class="back-btn" id="closeModal" type="button">← Back</button>
        </div>
      </div>
    </section>
  </div>
  <script src="cat-canvas.js"></script>
  <script src="index.js"></script>
  <script src="h-and-s.js"></script>
</body>
</html>
